name: Profile README build
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Get Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Configure pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/cache/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-
      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt
      - name: Update README file
        env:
          ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BIRTHDAY: ${{ secrets.BIRTHDAY }}
          USER_NAME: rhcp011235
        run: python today.py
      - name: Commit
        run: |-
          git add dark_mode.svg light_mode.svg cache
          git diff --cached --quiet || (
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git commit -m "Update profile stats"
            git push
          )
